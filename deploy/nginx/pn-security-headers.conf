# Installed to /etc/nginx/snippets/. Include in the server block AND in every
# location that sets its own add_header (Nginx drops inherited headers there).
#
# Not set here yet, on purpose:
#   Strict-Transport-Security  add after HTTPS is verified on production (INF-3)
#   Content-Security-Policy    needs a pass over YouTube and Church Center embeds first
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
