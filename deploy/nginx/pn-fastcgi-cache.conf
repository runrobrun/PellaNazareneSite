# Installed to /etc/nginx/snippets/. Include inside the `location ~ \.php$` block,
# right after `fastcgi_cache <ZONE>;`. Needs `$skip_cache` set in the server block.
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_valid 200 301 302 60m;
fastcgi_cache_valid 404 1m;
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache $skip_cache;

# Only one request rebuilds an expired page; others get the stale copy meanwhile,
# and a slow or failing PHP never takes the site down while a copy exists.
fastcgi_cache_lock on;
fastcgi_cache_use_stale error timeout updating http_500 http_503;
fastcgi_cache_background_update on;

add_header X-Cache $upstream_cache_status;
