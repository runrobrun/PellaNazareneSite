# Include inside each server block that serves the site (before the location blocks).
# Needs the maps in conf.d/pn-redirects.conf. `return` inside `if` is the safe use of `if` in Nginx.
error_page 410 @pn_gone;

if ($pn_gone) {
	return 410;
}
if ($pn_moved) {
	return 301 $pn_moved;
}

location @pn_gone {
	default_type text/html;
	return 410 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This page has been removed</title><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1rem"><h1>This page has been removed</h1><p>It no longer exists. You are always welcome at <a href="/">pellanazarene.org</a>.</p></body></html>';
}
