# http-level tuning. Installed to /etc/nginx/conf.d/ by scripts/apply-server-tuning.sh.
# (Ubuntu's nginx.conf already sets gzip on, gzip_vary, sendfile, and keepalive_timeout;
#  setting those again here would be a duplicate-directive error.)
server_tokens off;

gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/css text/plain text/xml application/javascript application/json
           application/xml application/rss+xml application/atom+xml image/svg+xml
           font/ttf font/otf application/vnd.ms-fontobject;

open_file_cache          max=2000 inactive=60s;
open_file_cache_valid    120s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;
