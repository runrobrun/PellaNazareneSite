# http-level security settings. Installed to /etc/nginx/conf.d/ by scripts/apply-server-tuning.sh.
#
# Throttle password guessing: /wp-login.php only, per client IP, 10 requests a minute (a short
# burst of 5 more is allowed in the vhost). The map gives every other URL an empty key, and Nginx
# does not rate-limit an empty key. Over the limit the visitor gets HTTP 429.
#
# IMPORTANT: this keys on $binary_remote_addr. Behind Cloudflare (INF-3) the real visitor IP must be
# restored first (cloudflare-realip), or every visitor looks like one Cloudflare address.
map $uri $pn_login_limit_key {
	default            "";
	~^/wp-login\.php$  $binary_remote_addr;
}
limit_req_zone $pn_login_limit_key zone=pn_login:10m rate=10r/m;
limit_req_status 429;
