# Old Ministry Designs URLs (see docs/pellanazarene-content-inventory.csv and deploy/redirects/expected.csv).
# http-level maps; the matching `if` lines are in snippets/pn-redirects-server.conf. Installed to /etc/nginx/conf.d/.
#
# Only rules that never depend on what is in the database live here. Sermons, speakers, and series
# (/sermons-t/<slug>/ ...) are answered by WordPress, because the right answer depends on whether the new
# page exists; see pn_legacy_url_action() in wp-content/mu-plugins/pn-site.php. That PHP also repeats these
# fixed rules as a safety net for local development, where Nginx is not in front.

# Archives that never had any content: gone for good (HTTP 410), so search engines drop them quickly.
map $uri $pn_gone {
	default 0;
	~*^/sermons-t/(?:u_topic|u_scripture)(?:/|$)                   1;
	~*^/events-2/(?:category|tag)(?:/|$)                           1;
	~*^/small-groups/(?:tag|category|u_group-details)(?:/|$)       1;
}

# Old sections with a fixed replacement (HTTP 301).
map $uri $pn_moved {
	default "";
	~*^/events-2(?:/.*)?$      /events/;
	~*^/news(?:/.*)?$          /blog/;
	~*^/sermons-t/?$           /sermons/;
	~*^/small-groups/.+$       /small-groups/;
}
