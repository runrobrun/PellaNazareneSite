; Installed to /etc/php/8.3/fpm/pool.d/pn.conf by scripts/apply-server-tuning.sh.
; Separate users prevent staging PHP from reading production's wp-config.php.
; The two pools share a 12-worker ceiling on the 4 GB server.
[production]
user = pn-production-php
group = pn-production-php
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

[staging]
user = pn-staging-php
group = pn-staging-php
listen = /run/php/php8.3-fpm-staging.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
