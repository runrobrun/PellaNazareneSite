; Installed to /etc/php/8.3/fpm/pool.d/pn.conf by scripts/apply-server-tuning.sh,
; which moves the packaged www.conf out of the way. Same pool name and socket, so
; Nginx config does not change.
;
; Sizing: 4 GB server shared by production, staging, MariaDB, and Redis.
; A WordPress worker uses roughly 60-100 MB, so 12 workers is about 1 GB worst case.
[www]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes

; WordPress core does not need to run shell commands from web requests.
; If a plugin breaks because of this list, remove only the function it needs.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
