name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment); update them on purpose, not silently.
jobs:
  php:
    name: PHP lint and WordPress coding standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dev tooling (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: WordPress coding standards
        run: vendor/bin/phpcs

  shell:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ShellCheck is preinstalled on GitHub's Ubuntu runners.
      - name: ShellCheck
        run: shellcheck scripts/*.sh deploy/*.sh deploy/tests/*.sh

      # Exercises the CI deploy wrapper (healthy, rollback heals, rollback cannot heal, deploy fails)
      # against stubs in a throwaway container; touches no server.
      - name: CI deploy wrapper tests
        run: docker run --rm -v "$PWD":/work:ro ubuntu:24.04 bash /work/deploy/tests/ci-deploy-harness.sh

  wordpress:
    name: WordPress security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real WordPress + the Two Factor plugin + our must-use plugin, exercised with real HTTP logins.
      - name: Two-factor enforcement and username-leak tests
        run: deploy/tests/wp-integration.sh

  nginx:
    name: Nginx config tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo's staging config loaded into the server's Nginx version, then real requests.
      - name: Blocked files, headers, and login throttle
        run: deploy/tests/nginx-config.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the whole history on every run (the gitleaks action only scans the
      # commits in the push or PR). Image pinned by digest; update it on purpose.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --no-banner --log-opts="--all"
