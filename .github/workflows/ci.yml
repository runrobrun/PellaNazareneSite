name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment); update them on purpose, not silently.
jobs:
  php:
    name: PHP lint and WordPress coding standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dev tooling (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: WordPress coding standards
        run: vendor/bin/phpcs

  shell:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ShellCheck is preinstalled on GitHub's Ubuntu runners.
      - name: ShellCheck
        run: shellcheck scripts/*.sh deploy/*.sh deploy/tests/*.sh

      # Exercises the CI deploy wrapper (healthy, rollback heals, rollback cannot heal, deploy fails)
      # against stubs in a throwaway container; touches no server.
      - name: CI deploy wrapper tests
        run: docker run --rm -v "$PWD":/work:ro ubuntu:24.04 bash /work/deploy/tests/ci-deploy-harness.sh

  wordpress:
    name: WordPress security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real WordPress + the Two Factor plugin + our must-use plugin, exercised with real HTTP logins.
      - name: Two-factor enforcement and username-leak tests
        run: deploy/tests/wp-integration.sh

      # Real WordPress + the pinned Fluent Forms: the Contact and Prayer Request forms are created from the repo
      # files, real submissions are sent, spam is turned away, the right people get the email, and prayer
      # requests are not kept. (Part of this job so it is already a required check.)
      - name: Contact and Prayer Request form tests
        run: deploy/tests/forms-check.sh

  sermons:
    name: Sermon import tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The parser that reads YouTube titles and descriptions, on real examples (pure PHP, no WordPress).
      - name: Sermon parser tests
        run: docker run --rm -v "$PWD":/repo:ro php:8.3-cli php /repo/deploy/tests/sermon-parser-test.php

      # The whole backfill against real WordPress and a fake YouTube: pagination, skips, drafts, duplicates,
      # re-runs, old-address redirects, failures, and that the API key never appears anywhere.
      - name: Sermon import tests
        run: deploy/tests/sermon-import-check.sh

  theme:
    name: Brand theme tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real WordPress + Twenty Twenty-Five + our theme: brand colors and fonts reach the page, nothing
      # dangling, locked-down options, WCAG contrast of every color pairing read from theme.json.
      - name: Brand colors, fonts, and contrast
        run: deploy/tests/theme-check.sh

      # The page photos: real WebP, small, no hidden camera or location data, every one described.
      - name: Photo files
        run: deploy/tests/photos-check.sh

      # The seven migrated pages: the create-pages script (safe to re-run, never overwrites staff edits), every
      # link, heading, brand color, header and footer, and no filler or old wrong hours.
      - name: Page tests
        run: deploy/tests/pages-check.sh

      # Logos and icons: exact brand colors, plain safe SVGs (no scripts or external references), each still
      # matches the designer's master, favicon set valid.
      - name: Logos, icons, and favicons
        run: deploy/tests/brand-assets-check.sh

  accessibility:
    name: Accessibility tests (axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # axe-core in a real browser: WCAG 2.2 A/AA + best practice on the home page (desktop, phone, and with the
      # mobile menu open), the 404 page, and search results.
      - name: Accessibility (axe-core)
        run: deploy/tests/a11y-check.sh

  redirects:
    name: Redirect tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nginx 1.24 + PHP-FPM 8.3 + WordPress + the sermon plugin + fixture content, as on the server. Every old URL
      # must do what deploy/redirects/expected.csv says: through Nginx, with PHP stopped (Nginx-only rows), and
      # through PHP alone. Also proves every URL in the old-site inventory has an outcome.
      - name: Old URLs redirect correctly
        run: deploy/tests/redirects-check.sh

  nginx:
    name: Nginx config tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo's staging config loaded into the server's Nginx version, then real requests.
      - name: Blocked files, headers, and login throttle
        run: deploy/tests/nginx-config.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the whole history on every run (the gitleaks action only scans the
      # commits in the push or PR). Image pinned by digest; update it on purpose.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --no-banner --log-opts="--all"
